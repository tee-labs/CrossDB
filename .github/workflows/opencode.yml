name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    concurrency:
      # Concurrency control: Ensures only one instance of OpenCode runs per PR/Issue.
      # If a new command is triggered (e.g., another "/oc" comment), the previous pending run is canceled.
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: true
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Record current JAVA_HOME
        shell: bash
        run: |
          echo "PREVIOUS_JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
      - name: Set up Java 21 for jdtls
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Restore JAVA_HOME and Setup jdtls
        if: ${{ inputs.lsp_java == 'true' }}
        shell: bash
        run: |
          JDTLS_VERSION="1.58.0"
          JDTLS_DATE="202604151538"
          URL="https://download.eclipse.org/jdtls/milestones/${JDTLS_VERSION}/jdtls-server-${JDTLS_VERSION}-${JDTLS_DATE}.tar.gz"
          mkdir -p $GITHUB_ACTION_PATH/jdtls
          curl -L $URL | tar -xzC $GITHUB_ACTION_PATH/jdtls
          chmod +x $GITHUB_ACTION_PATH/jdtls/bin/jdtls
          echo "JDTLS_HOME=$GITHUB_ACTION_PATH/jdtls" >> $GITHUB_ENV
          echo "$GITHUB_ACTION_PATH/jdtls/bin" >> $GITHUB_PATH
          if [ -n "$PREVIOUS_JAVA_HOME" ]; then
            echo "JAVA_HOME=$PREVIOUS_JAVA_HOME" >> $GITHUB_ENV
            echo "Restored JAVA_HOME to $PREVIOUS_JAVA_HOME"
          fi
      - name: Install rtk
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.9

      - name: Configure Git identity
        shell: bash
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"
      - name: Parse model from comment
        id: model
        shell: bash
        run: |
          COMMENT="${{ github.event.comment.body }}"
          DEFAULT="glm/glm-5.3-flash"
          if [[ "$COMMENT" == *"@zen"* ]]; then
            M="zen/deepseek-v4-flash-free"
          elif [[ "$COMMENT" == *"@glm52"* ]]; then
            M="glm/glm-5.2"
          elif [[ "$COMMENT" == *"@glm53"* ]]; then
            M="glm/glm-5.3"
          else
            M="$DEFAULT"
          fi
          echo "model=$M" >> "$GITHUB_OUTPUT"
      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        with:
          use_github_token: true
          model: ${{ steps.model.outputs.model }}
